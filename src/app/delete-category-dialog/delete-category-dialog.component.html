<div mat-dialog-content>
  Are you sure you want to delete category {{ categoryName }}
</div>
<div mat-dialog-actions>
  <button
    cdkFocusInitial
    class="ok-button"
    mat-button
    [mat-dialog-close]="true"
  >
    OK
  </button>
  <button class="cancel-button" mat-button [mat-dialog-close]="false">
    Cancel
  </button>
</div>
